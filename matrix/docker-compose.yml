# H4 - Mensajería instantánea y presencia: Matrix Synapse + Element Web
name: nexo-matrix
services:
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: nexo-synapse
    restart: unless-stopped
    volumes:
      - synapse_data:/data
    ports:
      - "8008:8008"
  element:
    image: vectorim/element-web:latest
    container_name: nexo-element
    restart: unless-stopped
    volumes:
      - ./element-config.json:/app/config.json:ro
    ports:
      - "8090:80"
    depends_on: [synapse]
volumes:
  synapse_data:
    name: nexo-synapse-data
