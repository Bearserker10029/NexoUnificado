limit_req_zone $binary_remote_addr zone=portal:10m rate=20r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP: solo comprobación de salud y redirección a HTTPS
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# HTTPS: punto único de entrada de la plataforma
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Portal web responsivo
    location / {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;
        limit_req zone=portal burst=40 nodelay;
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Tablero de monitoreo (Grafana detrás del proxy)
    location /grafana/ {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://grafana:3000;
    }
    location /grafana/api/live/ {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_pass http://grafana:3000;
    }

    # Softphone WebRTC estático, sin CDN ni claves guardadas en el navegador.
    location /voip/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:; img-src 'self' data:; media-src 'self' blob: data:" always;
        limit_req zone=portal burst=40 nodelay;
        alias /usr/share/nginx/voip/;
        try_files $uri $uri/ =404;
    }

    # Nginx termina WSS en 8443 y reenvía WebSocket a Asterisk por nexo_srv.
    location = /asterisk/ws {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade                $http_upgrade;
        proxy_set_header Connection             $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host                   $host;
        proxy_set_header X-Real-IP              $remote_addr;
        proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto      https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://asterisk:8088/ws;
    }
}
