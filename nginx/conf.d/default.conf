limit_req_zone $binary_remote_addr zone=nexo_web:10m rate=20r/s;
# Endpoints de autenticacion: rafagas pequenas, sin afectar trafico ordinario.
limit_req_zone $binary_remote_addr zone=nexo_auth:10m rate=10r/m;

# Cache de borde SOLO para estaticos (Element y Jitsi web). Nunca se activa en
# /_matrix/, /_synapse/ ni /voip/ (sesiones, SSO y datos dinamicos).
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=nexo:10m inactive=60m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preferencia local del navegador. El ID solo elige el punto de entrada OIDC.
map $cookie_nexo_login_provider $nexo_login_provider {
    default 1;
    "~^[1-9][0-9]{0,8}$" $cookie_nexo_login_provider;
}

map $uri $nexo_login_preference_cookie {
    default "";
    "~^/docs/apps/user_oidc/login/(?<nexo_selected_provider>[1-9][0-9]{0,8})/?$"
        "nexo_login_provider=$nexo_selected_provider; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax";
}

# HTTP: solo comprobación de salud y redirección a HTTPS
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# HTTPS: punto único de entrada de la plataforma
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Salud del proxy por TLS (monitoreo cifrado; VLAN 10 solo alcanza 8443).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok
";
    }

    # Raiz: login OIDC de Keycloak mediante Nextcloud. Todas las rutas usan
    # el mismo origen HTTPS para conservar la sesion entre servicios.
    location = / {
        return 302 https://$http_host/voip-sso/entrar;
    }

    # Pagina unica de acceso: identifica la empresa por usuario/correo y envia al SSO.
    location = /voip-sso/entrar {
        include /etc/nginx/snippets/seguridad.conf;
        limit_req zone=nexo_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://voip-gateway:5000/entrar;
    }

    location = /airi {
        return 308 https://$http_host/airi/;
    }

    location ^~ /airi/ {
        include /etc/nginx/snippets/seguridad.conf;
        resolver 127.0.0.11 valid=10s;
        set $assistant_upstream assistant:8000;
        proxy_pass http://$assistant_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 32k;
        proxy_read_timeout 140s;
        # Los callbacks de OIDC contienen códigos de un solo uso.
        access_log off;
    }

    # Tablero de monitoreo (Grafana detrás del proxy)
    location /grafana/ {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Grafana ya trae GF_SECURITY_ALLOW_EMBEDDING=true (no manda su
        # propio X-Frame-Options), pero por si acaso: dos valores distintos
        # de X-Frame-Options en la misma respuesta hacen que el navegador
        # bloquee el iframe igual, asi que se oculta el de Grafana antes de
        # que "seguridad.conf" agregue el nuestro (SAMEORIGIN).
        proxy_hide_header X-Frame-Options;
        proxy_pass http://grafana:3000;
    }
    location /grafana/api/live/ {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_pass http://grafana:3000;
    }

    # Softphone WebRTC estático. Las credenciales SIP individuales se obtienen
    # mediante OIDC y no se introducen manualmente.
    location /voip/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:; img-src 'self' data:; media-src 'self' blob: data:; frame-ancestors 'self'" always;
        limit_req zone=nexo_web burst=40 nodelay;
        alias /usr/share/nginx/voip/;
        try_files $uri $uri/ =404;
    }

    # Puente OIDC: valida Keycloak y aprovisiona una extension SIP individual.
    location /voip-sso/ {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://voip-gateway:5000/;
    }

    # Cualquier camino que termine en la pantalla de login propia de
    # Nextcloud (sesion vencida, "Cerrar sesion", enlaces viejos a
    # /docs/login) tambien salta directo a Keycloak, igual que la raiz, en
    # vez de mostrar la pantalla con el boton "Login with keycloak". El
    # redirect_url que arma Nextcloud se reenvia como redirectUrl para volver
    # a donde la persona iba.
    #
    # Solo para GET sin "?direct=1": el formulario de /docs/admin-login
    # envia sus credenciales con un POST a esta misma ruta ("/login", con el
    # prefijo /docs agregado por OVERWRITEWEBROOT), asi que un redirect sin
    # distinguir el metodo se comia el usuario/clave de nexo_admin antes de
    # que llegaran a Nextcloud. Y si la clave es incorrecta, Nextcloud
    # reintenta con un GET a esta misma ruta con "?direct=1&user=..." (ver
    # core/Controller/LoginController.php): sin la excepcion, ese reintento
    # tambien saltaria a Keycloak en vez de mostrar "clave incorrecta".
    location = /docs/login {
        if ($request_method = POST) {
            rewrite ^ /docs/login-post last;
        }
        if ($arg_direct) {
            rewrite ^ /docs/login-post last;
        }
        if ($arg_clear) {
            return 302 https://$http_host/voip-sso/entrar?salir=1;
        }
        return 302 https://$http_host/voip-sso/entrar;
    }
    location = /docs/login-post {
        include /etc/nginx/snippets/seguridad.conf;
        limit_req zone=nexo_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # El formulario local es solo para la cuenta tecnica: no se listan los
        # proveedores OIDC (keycloak, keycloak-<empresa>) en la pantalla de login.
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<style>#alternative-logins,.login-box__alternative-logins{display:none!important}</style></head>';
        sub_filter_once on;
        rewrite ^/docs/login-post$ /login break;
        proxy_pass http://nextcloud:80;
    }

    # Puerta trasera para entrar como nexo_admin (la cuenta local de
    # Nextcloud, fuera de Keycloak): sin esto no hay forma de llegar al
    # formulario de usuario/clave propio, porque tanto la raiz como
    # /docs/login saltan directo a Keycloak. No se enlaza desde ninguna
    # pantalla; solo quien conozca esta URL la usa.
    location = /docs/admin-login {
        include /etc/nginx/snippets/seguridad.conf;
        limit_req zone=nexo_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # El formulario local es solo para la cuenta tecnica: no se listan los
        # proveedores OIDC (keycloak, keycloak-<empresa>) en la pantalla de login.
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<style>#alternative-logins,.login-box__alternative-logins{display:none!important}</style></head>';
        sub_filter_once on;
        rewrite ^/docs/admin-login$ /login break;
        proxy_pass http://nextcloud:80;
    }

    # Apache elimina el puerto no estandar al agregar la barra de /docs.
    # Responder aqui conserva :8443 tambien al volver del login OIDC.
    location = /docs {
        return 308 https://$http_host/docs/;
    }

    # Menu unificado (Nextcloud). Unica puerta de entrada del H9: Nextcloud
    # delega el login en Keycloak (OpenID Connect) y desde aqui el usuario
    # salta a Jitsi, Element, Grafana y Telefonia sin volver a autenticarse.
    location /docs/ {
        include /etc/nginx/snippets/seguridad.conf;
        # Nextcloud manda "Feature-Policy: microphone 'none'; camera 'none'"
        # en todas sus respuestas. Un documento no puede delegar a un iframe
        # (External Sites -> /voip/embed.html -> /voip/) un permiso que el
        # no tiene, asi que sin esto el softphone nunca llega a pedir el
        # microfono aunque los iframes internos ya tengan su propio "allow".
        proxy_hide_header Feature-Policy;
        proxy_hide_header Permissions-Policy;
        add_header Permissions-Policy "microphone=(self), camera=(self)" always;
        add_header Set-Cookie $nexo_login_preference_cookie;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        client_max_body_size 4G;
        # Barra final: Nextcloud sirve en la raiz de su contenedor; el prefijo
        # /docs solo existe para el navegador (OVERWRITEWEBROOT lo agrega de
        # vuelta en los enlaces que genera).
        proxy_pass http://nextcloud:80/;
    }
    # DAV y otras rutas de Nextcloud fuera de /docs/ que algunos clientes asumen en la raiz.
    location ~ ^/\.well-known/(carddav|caldav)$ {
        return 301 /docs$request_uri;
    }

    # Collabora Online (edicion compartida). El navegador carga el editor y abre
    # el WebSocket por el mismo origen HTTPS; Collabora no se publica.
    location ^~ /browser {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://collabora:9980;
    }
    location ^~ /hosting/discovery {
        proxy_set_header Host $http_host;
        proxy_pass http://collabora:9980;
    }
    location ^~ /hosting/capabilities {
        proxy_set_header Host $http_host;
        proxy_pass http://collabora:9980;
    }
    location ~ ^/cool/(.*)/ws$ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 36000s;
        proxy_pass http://collabora:9980;
    }
    location ^~ /cool/adminws {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 36000s;
        proxy_pass http://collabora:9980;
    }
    location ~ ^/(c|l)ool {
        proxy_set_header Host $http_host;
        proxy_pass http://collabora:9980;
    }

    # Token OIDC: limite adicional por IP antes de llegar a Keycloak.
    location ~ ^/keycloak/realms/[^/]+/protocol/openid-connect/token$ {
        include /etc/nginx/snippets/seguridad.conf;
        limit_req zone=nexo_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Keycloak escucha en la raiz: conserva el mismo recorte que la ruta general.
        rewrite ^/keycloak/(.*)$ /$1 break;
        proxy_pass http://keycloak:8080;
    }

    # Keycloak (unico proveedor de identidad). --hostname incluye /keycloak
    # para que genere issuer/endpoints con ese prefijo; Keycloak en si
    # escucha en la raiz de su contenedor, por eso se recorta aqui (barra
    # final en location y en proxy_pass).
    location /keycloak/ {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://keycloak:8080/;
    }

    # E2EE activado por defecto para conversaciones nuevas. Element gestiona
    # las claves por dispositivo y la recuperacion; Keycloak solo autentica
    # la cuenta. Las salas cifradas existentes conservan sus claves.
    location = /.well-known/matrix/client {
        default_type application/json;
        return 200 '{"m.homeserver":{"base_url":"https://$http_host"},"io.element.e2ee":{"default":true,"force_disable":false}}';
    }

    # API de Matrix y callback OIDC en el mismo origen que Nextcloud/Element.
    location /_matrix/ {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        client_max_body_size 50M;
        proxy_pass http://synapse:8008;
    }
    location /_synapse/client/ {
        include /etc/nginx/snippets/seguridad.conf;
        # Synapse bloquea por defecto el HTML que completa el SSO. Nextcloud
        # necesita mostrar ese retorno dentro de External Sites; seguridad.conf
        # vuelve a agregar X-Frame-Options SAMEORIGIN en la respuesta final.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://synapse:8008;
    }

    # Element registra /sw.js en la raíz aunque la interfaz viva en /element/.
    # Sin esta ruta falla la carga de medios Matrix autenticados.
    location = /sw.js {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://element:80/sw.js;
    }

    # Chat (Element Web), servido bajo el mismo origen HTTPS.
    location /element/ {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache nexo;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://element:80/;
    }

    # Videoconferencia (Jitsi Meet web) bajo /jitsi/. La imagen trae
    # <base href="/" /> fijo; sub_filter adapta sus recursos a la subruta.
    location /jitsi/ {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding   "";
        sub_filter '<base href="/" />' '<base href="/jitsi/" />';
        sub_filter_once on;
        proxy_cache nexo;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://jitsi-web:8000/;
    }
    location /jitsi/http-bind {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $http_host;
        proxy_pass http://jitsi-web:8000/http-bind;
    }
    location /jitsi/xmpp-websocket {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_pass http://jitsi-web:8000/xmpp-websocket;
    }

    # Nginx termina WSS en 8443 y reenvía WebSocket a Asterisk por nexo_srv.
    location = /asterisk/ws {
        include /etc/nginx/snippets/seguridad.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade                $http_upgrade;
        proxy_set_header Connection             $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host                   $host;
        proxy_set_header X-Real-IP              $remote_addr;
        proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto      https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://asterisk:8088/ws;
    }

    # Rutas multiempresa generadas; vacio en el despliegue tradicional.
    include /etc/nginx/tenants/*.conf;
}

# Listener interno (no publicado): Collabora llama aqui a Nextcloud (WOPI) por
# HTTP dentro de la red de Docker, sin pasar por el certificado autofirmado.
server {
    listen 8082;
    server_name _;
    server_tokens off;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location /docs/ {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 4G;
        proxy_read_timeout 3600s;
        proxy_pass http://nextcloud:80/;
    }
    location / {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 4G;
        proxy_read_timeout 3600s;
        proxy_pass http://nextcloud:80;
    }
}
