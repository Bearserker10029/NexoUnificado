# Nexo Unificado — H7 Keycloak (LABORATORIO, NO PRODUCCION)
# start-dev usa HTTP y una base de datos local de desarrollo.
# El servicio se publica unicamente en 127.0.0.1 de Windows.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: nexo-keycloak
    restart: unless-stopped
    command: ["start-dev", "--hostname=http://localhost:18086", "--hostname-backchannel-dynamic=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-nexo_admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Agrega KC_ADMIN_PASSWORD al archivo .env}
    ports:
      - "127.0.0.1:18086:8080"
    volumes:
      - keycloak_dev_data:/opt/keycloak/data
    networks: [srv]

volumes:
  keycloak_dev_data:
