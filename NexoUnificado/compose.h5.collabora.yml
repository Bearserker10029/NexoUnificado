services:
  collabora:
    image: collabora/code:latest
    container_name: nexo-collabora
    restart: unless-stopped
    ports:
      - "127.0.0.1:18087:9980"
    environment:
      aliasgroup1: "http://nextcloud:80"
      extra_params: "--o:ssl.enable=false --o:ssl.termination=false --o:server_name=localhost:18087"
    cap_add:
      - MKNOD
    networks:
      - srv