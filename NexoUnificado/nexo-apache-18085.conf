# Puerto interno adicional para que el navegador y Nextcloud usen
# la misma URL http://localhost:18085 en el laboratorio local.
Listen 18085
<VirtualHost *:18085>
    ServerName localhost
    DocumentRoot /var/www/html
    <Directory /var/www/html/>
        Options FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/nexo-office-error.log
    CustomLog ${APACHE_LOG_DIR}/nexo-office-access.log combined
</VirtualHost>
