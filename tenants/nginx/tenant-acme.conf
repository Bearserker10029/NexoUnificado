# Generado para acme; se incluye dentro del servidor HTTPS existente.
    location = /acme/ {
        return 302 https://$http_host/acme/element/;
    }
    location = /_nexo_tenant_auth_acme {
        internal;
        proxy_pass http://voip-gateway:5000/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }
    location @nexo_tenant_login_acme {
        return 302 https://$http_host/voip-sso/acme/login?next=$request_uri;
    }
    location /acme/_matrix/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        client_max_body_size 50M;
        proxy_pass http://synapse-acme:8008/_matrix/;
    }
    location /acme/_synapse/client/ {
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://synapse-acme:8008/_synapse/client/;
    }
    location /acme/element/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://element-acme:80/;
    }
    location /acme/voip/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:; img-src 'self' data:; media-src 'self' blob: data:; frame-ancestors 'self'" always;
        alias /usr/share/nginx/voip/;
        try_files $uri $uri/ =404;
    }
    location /acme/voip-sso/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://voip-gateway:5000/;
    }
    location /acme/jitsi/ {
        auth_request /_nexo_tenant_auth_acme;
        error_page 401 = @nexo_tenant_login_acme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        sub_filter '<base href="/" />' '<base href="/acme/jitsi/" />';
        sub_filter_once on;
        proxy_pass http://jitsi-web-acme:8000/;
    }
    location /acme/jitsi/http-bind {
        auth_request /_nexo_tenant_auth_acme;
        error_page 401 = @nexo_tenant_login_acme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_pass http://jitsi-web-acme:8000/http-bind;
    }
    location /acme/jitsi/xmpp-websocket {
        auth_request /_nexo_tenant_auth_acme;
        error_page 401 = @nexo_tenant_login_acme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_pass http://jitsi-web-acme:8000/xmpp-websocket;
    }
