[general]
static=yes
writeprotect=no
clearglobalvars=yes

[globals]

[internal]
; Bloqueo explícito de prefijos internacionales habituales.
exten => _00X.,1,Log(WARNING,Destino internacional bloqueado desde ${CALLERID(num)}: ${EXTEN})
 same => n,Hangup(21)
exten => _011X.,1,Log(WARNING,Destino internacional bloqueado desde ${CALLERID(num)}: ${EXTEN})
 same => n,Hangup(21)
exten => _+X.,1,Log(WARNING,Destino internacional bloqueado desde ${CALLERID(num)}: ${EXTEN})
 same => n,Hangup(21)

; Dos extensiones lógicas. Cada una puede sonar en SIP/TLS y WebRTC.
exten => 100,1,Dial(PJSIP/100&PJSIP/1100,30)
 same => n,Hangup()
exten => 101,1,Dial(PJSIP/101&PJSIP/1101,30)
 same => n,Hangup()
exten => 1100,1,Goto(internal,100,1)
exten => 1101,1,Goto(internal,101,1)

; Política de denegar por defecto: no existe troncal ni salida a PSTN.
exten => _X.,1,Log(WARNING,Destino no autorizado desde ${CALLERID(num)}: ${EXTEN})
 same => n,Playback(invalid)
 same => n,Hangup(21)
